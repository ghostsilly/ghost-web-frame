# 服务端口
server:
  port: 8080

spring:
  application:
    name: ghost-frame-backend
  datasource:
    url: jdbc:mysql://localhost:3306/silly_ghost_frame
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${mysql.username}
    password: ${mysql.password}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  type-aliases-package: com.ghost.frame.modules
