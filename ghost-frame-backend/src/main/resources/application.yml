# 服务端口
server:
  port: 10583
# 服务名称
spring:
  application:
    name: ghost-frame-backend
  # 配置文件
  profiles:
    active: local
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/silly_ghost_frame
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${mysql.username}
    password: ${mysql.password}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.ghost.frame.modules
  mapper-locations: classpath*:com.ghost.frame.modules.mapper/*.xml

# JWT 配置
jwt:
  secret: ${jwt.jwt-secret}
  expiration-ms: 21600000   #  半天
  refresh-expiration-ms: 604800000

# API 统一前缀
api: /ghost